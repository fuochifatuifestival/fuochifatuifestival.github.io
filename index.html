<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Font: per cambiarli aggiorna qui e le variabili --font- in style.css -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5: griglia e utility responsive -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Stile del sito: carica DOPO Bootstrap per avere la precedenza -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- Tutta la pagina viene costruita qui dentro -->
  <main id="app"></main>

  <!-- SCRIPT: BASE="" perché questa pagina è nella cartella principale.
       Carichiamo: configurazione globale (con l'ID di Google Analytics),
       Google Analytics, dati delle edizioni passate, motore del sito,
       poi l'avvio. -->
  <script>window.BASE = "";</script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/ga.js"></script>
  <script src="assets/js/festival.js"></script>
  <script>
    /* Mostra la home: chi-siamo + carosello (nessun evento in programma).
       Quando annuncerai una nuova edizione, in config.js metti
       hasUpcoming:true, current:"<anno>", aggiungi lo script
       editions/<anno>/edition.js nella pagina dell'edizione: la home
       mostrerà automaticamente la pagina evento. */
    Festival.renderHome("#app");
  </script>
</body>
</html>
